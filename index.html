<!doctype html>
<html lang="ar" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/yaqadha-logo.svg" />
    <link rel="icon" type="image/png" href="/yaqadha-logo.png" />
    <title>منصة يقظة | عهد جديد من الحوكمة الرقمية والنزاهة الاستباقية</title>
    <meta name="description" content="منصة يقظة للرقابة والنزاهة الاستباقية، تتبع وتوثيق المستندات، إدارة الصلاحيات والمنافسات، وحظر المعاملات المخالفة تلقائياً." />
    <meta property="og:title" content="منصة يقظة | عهد جديد من الحوكمة الرقمية والنزاهة الاستباقية" />
    <meta property="og:description" content="المنصة الرائدة في النزاهة الاستباقية والحوكمة الرقمية المؤسسية. رصد لحظي، تجميد تلقائي للمخالفات، وتوثيق مشفر." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Same theme key as the platform (/platform/), applied before first paint
      (function () {
        try {
          var theme = localStorage.getItem('yaqadha_theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6FAF7] dark:bg-[#0D1210] text-slate-900 dark:text-slate-100 selection:bg-emerald-500/20 antialiased font-['IBM_Plex_Sans_Arabic'] transition-colors duration-[350ms] ease-in-out" dir="rtl">
    <div id="root" dir="rtl"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
