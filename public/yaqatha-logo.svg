<svg viewBox="0 0 400 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="yaqatha-pupil-highlight-mask">
      <rect width="400" height="440" fill="white" />
      <circle cx="213" cy="217" r="9.5" fill="black" />
    </mask>
  </defs>

  <!-- Central vertical stem -->
  <line x1="200" y1="36" x2="200" y2="148" stroke="#2C3E28" stroke-width="13" stroke-linecap="butt" />

  <!-- Palm Fronds - 4 radiating tiers on each side -->
  <!-- Tier 1 -->
  <path d="M 200 82 L 140 42 L 172 96" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" stroke-linejoin="miter" />
  <path d="M 200 82 L 260 42 L 228 96" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" stroke-linejoin="miter" />

  <!-- Tier 2 -->
  <path d="M 172 96 L 94 88 L 132 142" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" stroke-linejoin="miter" />
  <path d="M 228 96 L 306 88 L 268 142" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" stroke-linejoin="miter" />

  <!-- Tier 3 -->
  <path d="M 132 142 L 68 150 L 114 192" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" stroke-linejoin="miter" />
  <path d="M 268 142 L 332 150 L 286 192" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" stroke-linejoin="miter" />

  <!-- Tier 4 -->
  <path d="M 114 192 L 50 216 L 148 202" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" stroke-linejoin="miter" />
  <path d="M 286 192 L 350 216 L 252 202" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" stroke-linejoin="miter" />

  <!-- Upper Eyelid Arch -->
  <path d="M 82 230 C 115 190 155 168 200 168 C 245 168 285 190 318 230" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" />

  <!-- Lower Eyelid Arch -->
  <path d="M 82 230 C 115 270 155 292 200 292 C 245 292 285 270 318 230" stroke="#2C3E28" stroke-width="13" stroke-linecap="round" />

  <!-- Center Pupil with highlight cutout -->
  <circle cx="200" cy="230" r="26" fill="#2C3E28" mask="url(#yaqatha-pupil-highlight-mask)" />

  <!-- Inner Spiral around Pupil -->
  <path d="M 210 196 C 180 196 166 212 166 232 C 166 256 182 270 200 270 C 218 270 234 256 234 232" stroke="#2C3E28" stroke-width="12" stroke-linecap="round" />

  <!-- Continuous Droplet / Loop at the bottom -->
  <path d="M 225 275 C 225 295 208 310 200 315 C 185 325 170 345 170 370 C 170 395 183 410 200 410 C 217 410 230 395 230 370 C 230 345 215 325 200 315 C 192 310 175 295 175 275" stroke="#2C3E28" stroke-width="12" stroke-linecap="round" />
</svg>
